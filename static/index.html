<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transkrip YouTube</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Literata:opsz,wght@7..72,400;7..72,500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f2f5f8;
    --panel: #ffffff;
    --ink: #13202c;
    --muted: #5d6b79;
    --rule: #cfd7df;
    --accent: #2447e6;
    --accent-ink: #ffffff;
    --mark: #ffe357;
    --danger: #b3261e;
    --ui: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --read: "Literata", Georgia, "Times New Roman", serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #0f161d;
      --panel: #16202a;
      --ink: #e6edf3;
      --muted: #97a6b5;
      --rule: #2a3946;
      --accent: #7d96ff;
      --accent-ink: #0b1220;
      --mark: #7a6a10;
      --danger: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: 1rem; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 16px/1.5 var(--ui);
  }
  a { color: var(--accent); }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .wrap { max-width: 1120px; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }

  h1 {
    font: 600 clamp(2rem, 5vw, 3.25rem)/1.08 var(--ui);
    letter-spacing: -0.02em;
    margin: 0 0 1.5rem;
    max-width: 16ch;
  }

  .finder { display: flex; gap: .75rem; flex-wrap: wrap; }
  .finder input {
    flex: 1 1 320px;
    min-width: 0;
    font: 400 1.125rem var(--ui);
    padding: .85rem 1rem;
    color: var(--ink);
    background: var(--panel);
    border: 1.5px solid var(--rule);
    border-radius: 6px;
  }
  .finder input::placeholder { color: var(--muted); }

  button, select {
    font: 500 .95rem var(--ui);
    color: var(--ink);
    background: var(--panel);
    border: 1.5px solid var(--rule);
    border-radius: 6px;
    padding: .6rem .9rem;
    cursor: pointer;
  }
  button:hover:not(:disabled), select:hover { border-color: var(--muted); }
  button:disabled { opacity: .5; cursor: progress; }
  button.primary {
    background: var(--accent);
    color: var(--accent-ink);
    border-color: var(--accent);
    padding: .85rem 1.4rem;
    font-size: 1.05rem;
  }

  .status { min-height: 1.5rem; margin: 1rem 0 0; color: var(--muted); }
  .status.error { color: var(--danger); }

  .result { display: none; margin-top: 2rem; gap: 2.5rem; grid-template-columns: 300px 1fr; align-items: start; }
  .result.on { display: grid; }

  .side { position: sticky; top: 1rem; display: grid; gap: 1.25rem; }
  .side h2 { font: 600 1.2rem/1.3 var(--ui); margin: 0; overflow-wrap: anywhere; }
  .side .meta { margin: .25rem 0 0; color: var(--muted); font-size: .92rem; }
  .field { display: grid; gap: .35rem; }
  .field > label, .field > span { font-size: .9rem; color: var(--muted); }
  .field select, .field input[type=search] { width: 100%; }
  .field input[type=search] {
    font: 400 .95rem var(--ui);
    color: var(--ink);
    background: var(--panel);
    border: 1.5px solid var(--rule);
    border-radius: 6px;
    padding: .6rem .8rem;
  }
  .check { display: flex; gap: .6rem; align-items: center; font-size: .95rem; }
  .check input { width: 1.1rem; height: 1.1rem; accent-color: var(--accent); }
  .actions { display: flex; flex-wrap: wrap; gap: .5rem; }
  .count { color: var(--muted); font-size: .88rem; min-height: 1.3rem; }

  .doc { background: var(--panel); border: 1.5px solid var(--rule); border-radius: 6px; padding: .5rem 0; }
  .row { display: grid; grid-template-columns: 5.25rem 1fr; gap: 1rem; padding: .45rem 1.25rem .45rem 0; }
  .row.hide-time { grid-template-columns: 1fr; padding-left: 1.5rem; }
  .row.hide-time .t { display: none; }
  .t {
    text-align: right;
    font: 500 .85rem/1.9 var(--ui);
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    text-decoration: none;
    padding-left: .5rem;
  }
  .t:hover { color: var(--accent); text-decoration: underline; }
  .s { font: 400 1.075rem/1.7 var(--read); max-width: 70ch; margin: 0; }
  mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }
  mark.current { outline: 2px solid var(--ink); }

  @media (max-width: 820px) {
    .result.on { grid-template-columns: 1fr; gap: 1.5rem; }
    .side { position: static; }
  }
  @media (prefers-reduced-motion: no-preference) {
    button { transition: border-color .15s; }
  }
</style>
</head>
<body>
<main class="wrap">
  <h1>Ubah video YouTube menjadi teks</h1>

  <form class="finder" id="form">
    <input id="url" type="text" inputmode="url" autocomplete="off" spellcheck="false"
           placeholder="Tempel tautan video YouTube" aria-label="Tautan video YouTube" required>
    <button class="primary" id="go" type="submit">Ambil transkrip</button>
  </form>
  <p class="status" id="status" role="status" aria-live="polite"></p>

  <section class="result" id="result">
    <aside class="side">
      <div>
        <h2 id="title"></h2>
        <p class="meta" id="meta"></p>
      </div>

      <div class="field">
        <label for="lang">Bahasa transkrip</label>
        <select id="lang"></select>
      </div>

      <label class="check">
        <input type="checkbox" id="showTime" checked> Tampilkan waktu
      </label>

      <div class="field">
        <label for="q">Cari di transkrip</label>
        <input type="search" id="q" placeholder="Kata kunci">
        <span class="count" id="count"></span>
      </div>

      <div class="actions">
        <button type="button" id="copy">Salin teks</button>
        <button type="button" id="dlTxt">Unduh .txt</button>
        <button type="button" id="dlSrt">Unduh .srt</button>
      </div>
    </aside>

    <article class="doc" id="doc" aria-label="Transkrip"></article>
  </section>
</main>

<script>
const $ = (s) => document.querySelector(s);
const pad = (n) => String(n).padStart(2, "0");
let data = null;

function clock(sec) {
  sec = Math.floor(sec);
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  return h ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
}

function srtClock(sec) {
  const ms = Math.round(sec * 1000);
  const h = Math.floor(ms / 3600000), m = Math.floor((ms % 3600000) / 60000);
  const s = Math.floor((ms % 60000) / 1000), r = ms % 1000;
  return `${pad(h)}:${pad(m)}:${pad(s)},${String(r).padStart(3, "0")}`;
}

function setStatus(msg, isError = false) {
  const el = $("#status");
  el.textContent = msg;
  el.classList.toggle("error", isError);
}

async function load(lang = "") {
  const url = $("#url").value.trim();
  if (!url) return;
  $("#go").disabled = true;
  setStatus("Mengambil transkrip…");
  try {
    const qs = new URLSearchParams({ url, lang });
    const res = await fetch(`/api/transcript?${qs}`);
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || "Terjadi kesalahan.");
    data = body;
    render();
    setStatus("");
  } catch (err) {
    setStatus(err.message, true);
  } finally {
    $("#go").disabled = false;
  }
}

function render() {
  $("#result").classList.add("on");
  $("#title").textContent = data.title;
  $("#meta").textContent = [
    data.author,
    `${data.snippets.length} baris`,
    data.is_generated ? "dibuat otomatis" : "dibuat manual",
  ].filter(Boolean).join(", ");

  const sel = $("#lang");
  sel.replaceChildren();
  for (const l of data.available) {
    const opt = document.createElement("option");
    opt.value = l.code;
    opt.textContent = l.name + (l.generated ? " (otomatis)" : "");
    if (l.code === data.language_code) opt.selected = true;
    sel.append(opt);
  }
  drawDoc();
}

function highlight(el, text, q) {
  if (!q) { el.textContent = text; return 0; }
  const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
  let last = 0, n = 0;
  for (const m of text.matchAll(re)) {
    el.append(text.slice(last, m.index));
    const mk = document.createElement("mark");
    mk.textContent = m[0];
    el.append(mk);
    last = m.index + m[0].length;
    n++;
  }
  el.append(text.slice(last));
  return n;
}

function drawDoc() {
  const q = $("#q").value.trim();
  const showTime = $("#showTime").checked;
  const doc = $("#doc");
  const frag = document.createDocumentFragment();
  let total = 0;

  for (const s of data.snippets) {
    const row = document.createElement("div");
    row.className = "row" + (showTime ? "" : " hide-time");

    const t = document.createElement("a");
    t.className = "t";
    t.href = `https://www.youtube.com/watch?v=${data.video_id}&t=${Math.floor(s.start)}s`;
    t.target = "_blank";
    t.rel = "noopener";
    t.textContent = clock(s.start);

    const p = document.createElement("p");
    p.className = "s";
    total += highlight(p, s.text.replace(/\n/g, " "), q);

    row.append(t, p);
    frag.append(row);
  }
  doc.replaceChildren(frag);

  $("#count").textContent = q ? (total ? `${total} hasil. Tekan Enter untuk lompat.` : "Tidak ada hasil.") : "";
  jumpIndex = -1;
}

let jumpIndex = -1;
function jump() {
  const marks = [...document.querySelectorAll("#doc mark")];
  if (!marks.length) return;
  marks.forEach((m) => m.classList.remove("current"));
  jumpIndex = (jumpIndex + 1) % marks.length;
  const m = marks[jumpIndex];
  m.classList.add("current");
  m.scrollIntoView({ block: "center" });
}

function plainText() {
  const withTime = $("#showTime").checked;
  return data.snippets
    .map((s) => (withTime ? `[${clock(s.start)}] ` : "") + s.text.replace(/\n/g, " "))
    .join("\n");
}

function srtText() {
  return data.snippets.map((s, i) => {
    const end = s.start + s.duration;
    return `${i + 1}\n${srtClock(s.start)} --> ${srtClock(end)}\n${s.text}\n`;
  }).join("\n");
}

function download(name, content, type) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([content], { type }));
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
}

const safeName = () => (data.title || data.video_id).replace(/[^\w\- ]+/g, "").trim().slice(0, 80) || data.video_id;

$("#form").addEventListener("submit", (e) => { e.preventDefault(); load(); });
$("#lang").addEventListener("change", (e) => load(e.target.value));
$("#showTime").addEventListener("change", drawDoc);
$("#q").addEventListener("input", drawDoc);
$("#q").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); jump(); } });

$("#copy").addEventListener("click", async (e) => {
  try {
    await navigator.clipboard.writeText(plainText());
    e.target.textContent = "Tersalin";
  } catch {
    e.target.textContent = "Gagal menyalin";
  }
  setTimeout(() => (e.target.textContent = "Salin teks"), 1500);
});
$("#dlTxt").addEventListener("click", () => download(`${safeName()}.txt`, plainText(), "text/plain;charset=utf-8"));
$("#dlSrt").addEventListener("click", () => download(`${safeName()}.srt`, srtText(), "application/x-subrip;charset=utf-8"));
</script>
</body>
</html>
